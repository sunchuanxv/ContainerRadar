name: Build

# 什么时候跑：
#   - 推到 main 分支（验证代码没坏）
#   - 开 PR（验证别人的改动）
#   - 打 v* 标签（除了验证，还会自动发 Release）
#   - 手动触发（仓库页面 Actions 面板里的 Run workflow）
on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

# 发布 Release 需要写权限
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 这里的 JDK 17 会被 setup-java 写进 JAVA_HOME，
      # 所以项目里不需要（也不应该）写死 org.gradle.java.home
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 缓存 Gradle 用户目录，第二次之后的构建会快很多
      # （首次仍要下载 Minecraft 并反编译，约 5-10 分钟，这是 Forge 模组的固有成本）
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # 仓库里 gradlew 的可执行位在 Windows 上提交时可能丢失，Linux runner 上必须补
      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build
        run: ./gradlew build --no-daemon --stacktrace

      # 产物挂到 workflow 页面，任何人不用编译就能下载最新构建
      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: containerradar-jar
          path: build/libs/*.jar
          if-no-files-found: error

      # 只有打标签时才发 Release。标签形如 v0.1.0
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/libs/*.jar
          generate_release_notes: true
